# Same as main.yaml; run after switching to the per-channel int8 vision model (2026-11-26).
# Main evaluation: zero-shot baselines vs a linear probe on frozen CLIP embeddings,
# plus calibration, abstention and the not-food guard.
run_name: main-int8vision
seed: 42
datasets: [food101, indianfoods]      # prepared by `python -m ml.datasets`
ood_set: commons                      # hand-picked Wikimedia Commons photos (python -m ml.fetch_testset)
probe:
  C_grid: [0.1, 0.3, 1, 3, 10, 30]    # inverse L2 strength, chosen on val
hybrid:
  weight_grid: [0.0, 0.25, 0.5, 0.75, 0.9, 1.0]   # chosen on val
select_model_by: val_top1             # between zero-shot ensemble and hybrid
abstention:
  target_accuracy: 0.85               # lowest threshold reaching this accuracy on val
not_food:
  val_fraction: 0.5                   # non-food images split into val/test halves (seeded)
export_artifacts: true                # write backend/artifacts/recognizer.json (+ probe)
